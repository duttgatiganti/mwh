apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook
webhooks:
  - name: pod-labeler.k8s.io
    clientConfig:
      service:
        name: pod-labeler-service
        namespace: default
        path: /mutate
      caBundle: 


    rules:
